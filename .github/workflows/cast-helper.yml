name: cast-helper

on:
  push:
    branches: [master]
    tags: ["cast-v*"]
    paths: ["helpers/cast/**", ".github/workflows/cast-helper.yml"]
  pull_request:
    paths: ["helpers/cast/**", ".github/workflows/cast-helper.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: helpers/cast

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: helpers/cast/go.mod
          cache-dependency-path: helpers/cast/go.sum
      - run: go vet ./...
      - run: go test ./...

  # A tag cast-vX.Y.Z publishes the helper for plugin version X.Y.Z.
  # Asset names follow `uname -m`, which the plugin's download command uses.
  release:
    if: startsWith(github.ref, 'refs/tags/cast-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: helpers/cast/go.mod
          cache-dependency-path: helpers/cast/go.sum
      - name: Check the tag matches plugin.json
        run: |
          version=$(jq -r .version ../../Cast/plugin.json)
          [ "$GITHUB_REF_NAME" = "cast-v$version" ] || { echo "tag $GITHUB_REF_NAME, plugin.json $version"; exit 1; }
      - name: Build
        run: |
          mkdir -p dist
          for arch in amd64:x86_64 arm64:aarch64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=${arch%%:*} go build -trimpath -ldflags "-s -w" -o "dist/cast-helper-${arch##*:}" .
          done
          (cd dist && sha256sum cast-helper-* > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Cast $GITHUB_REF_NAME" --notes "Helper binaries for the Cast plugin, built from this tag."
